x-database: &database
  POSTGRES_DB: fulfilment
  POSTGRES_USER: fulfilment
  POSTGRES_PASSWORD: fulfilment

services:
  db:
    image: postgres:16
    environment:
      <<: *database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *database
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python scripts/wait_for_database.py &&
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
